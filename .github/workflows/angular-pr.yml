name: Angular PR

on:
  workflow_dispatch: {}
  pull_request:
    branches:
    - main
    paths:
    - src/bhs-web-angular-app/**
    - yarn.lock

permissions:
  contents: read

env:
  CLIENTAPP_PATH: ./src/bhs-web-angular-app

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: corepack enable
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
    - run: yarn workspaces focus bhs-generated-models
    - run: yarn codegen

    - run: yarn workspaces focus bhs-web-angular-app
      working-directory: ${{ env.CLIENTAPP_PATH }}
    - run: yarn lint
      working-directory: ${{ env.CLIENTAPP_PATH }}
    - run: yarn build
      working-directory: ${{ env.CLIENTAPP_PATH }}
    - run: yarn test-ci
      working-directory: ${{ env.CLIENTAPP_PATH }}
