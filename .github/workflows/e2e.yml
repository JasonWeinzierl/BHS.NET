name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The GitHub Actions environment of the subject under test.
        required: false
        type: choice
        options:
        - staging
        - production
        default: staging
      smoke:
        description: Only run smoke tests.
        required: false
        type: boolean
        default: false
      bail:
        description: Bail on first test failure.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      smoke:
        required: false
        type: boolean
      bail:
        required: false
        type: boolean
    secrets:
      CYPRESS_AUTH0_TEST_PASSWORD:
        required: true

permissions:
  contents: read

env:
  E2E_DIRECTORY: ./src/bhs-e2e
  NODE_VERSION: '24'

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: corepack enable
    - name: Setup Node.js with caching
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: yarn

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'
    - run: yarn workspaces focus bhs-generated-models
    - run: yarn codegen

    - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      id: setup-chrome
      with:
        install-chromedriver: true

    - run: yarn workspaces focus bhs-e2e
      working-directory: ${{ env.E2E_DIRECTORY }}

    # Run smoke first to wait for site startup.
    - name: Run Smoke E2E
      run: |
        reporter_args=()
        if [[ "${SMOKE_ONLY}" != "true" ]]; then
          reporter_args+=(--reporters=spec)
        fi
        yarn e2e --baseUrl="${VARS_CYPRESS_BASE_URL}" --spec=liveness "${reporter_args[@]}"
      working-directory: ${{ env.E2E_DIRECTORY }}
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        E2E_auth0Domain: ${{ vars.CYPRESS_AUTH0_DOMAIN }}
        E2E_auth0ClientId: ${{ vars.CYPRESS_AUTH0_CLIENT_ID }}
        E2E_auth0TestUsername: ${{ vars.CYPRESS_AUTH0_TEST_USERNAME }}
        E2E_auth0TestPassword: ${{ secrets.CYPRESS_AUTH0_TEST_PASSWORD }}
        SMOKE_ONLY: ${{ inputs.smoke }}
        VARS_CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}

    # Run full E2E unless smoke-only is specified.
    - name: Run Full E2E
      if: ${{ inputs.smoke != true }}
      run: yarn e2e --baseUrl="${VARS_CYPRESS_BASE_URL}"
      working-directory: ${{ env.E2E_DIRECTORY }}
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        E2E_auth0Domain: ${{ vars.CYPRESS_AUTH0_DOMAIN }}
        E2E_auth0ClientId: ${{ vars.CYPRESS_AUTH0_CLIENT_ID }}
        E2E_auth0TestUsername: ${{ vars.CYPRESS_AUTH0_TEST_USERNAME }}
        E2E_auth0TestPassword: ${{ secrets.CYPRESS_AUTH0_TEST_PASSWORD }}
        BAIL_COUNT: ${{ inputs.bail && '1' || '0' }}
        VARS_CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}

    # TODO: consider adding wdio video reporter and capture here. Leftover cypress commented out.
