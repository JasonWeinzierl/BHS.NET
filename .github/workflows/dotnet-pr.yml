name: .NET PR

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - Directory.Build.props
      - Directory.Packages.props
      - BHS.slnx
      - src/**
      - '!src/bhs-web-angular-app/**'
      - tests/**

jobs:
  build-and-test:
    strategy:
      matrix:
        runs-on: 
          - macOS-latest
          - ubuntu-22.04 # EphemeralMongo currently breaks on ubuntu-latest (v24) per asimmon/ephemeral-mongo#57
          - windows-latest

    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - run: dotnet restore
    - name: Run dotnet build
      run: dotnet build --no-restore --configuration Release
    - name: Run dotnet test
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    - name: Summarize coverage
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      if: runner.os == 'Linux'
      with:
        reports: coverage/**/coverage.cobertura.xml
        targetdir: coverage-summary
        reporttypes: TextSummary;MarkdownSummaryGithub
    - name: Publish coverage
      if: runner.os == 'Linux'
      run: |
        cat coverage-summary/Summary.txt
        cat coverage-summary/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
