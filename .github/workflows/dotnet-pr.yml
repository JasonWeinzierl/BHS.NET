name: .NET PR

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - BHS.slnx
      - src/**
      - '!src/bhs-web-angular-app/**'
      - tests/**

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        runs-on: 
          - macOS-latest
          - ubuntu-22.04 # EphemeralMongo currently breaks on ubuntu-latest (v24) per asimmon/ephemeral-mongo#57
          - windows-latest

    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
    - run: dotnet restore
    - name: Run dotnet build
      run: dotnet build --no-restore --configuration Release
    - name: Run dotnet test
      run: dotnet test --no-build --configuration Release --verbosity normal --coverage --coverage-output-format cobertura --results-directory ./coverage
    - name: Summarize coverage
      uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # v5.5.12
      if: runner.os == 'Linux'
      with:
        reports: coverage/**/*.cobertura.xml
        targetdir: coverage-summary
        reporttypes: TextSummary;MarkdownSummaryGithub
    - name: Publish coverage
      if: runner.os == 'Linux'
      run: |
        cat coverage-summary/Summary.txt
        cat coverage-summary/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
