<dialog
  #dialog
  class="modal bg-neutral/75"
  aria-labelledby="photo-preview-title"
  aria-modal="true"
>
  <div
    class="modal-box grid h-dvh w-screen max-w-none grid-rows-[auto_minmax(0,1fr)_auto] overflow-hidden rounded-none bg-transparent p-3 text-neutral-content shadow-none md:p-5"
  >
    <header class="flex items-center justify-between">
      <p class="truncate font-medium">{{album().name}}</p>
      <a
        #closeButton
        class="btn btn-circle"
        [routerLink]="['/apps/photos/album', album().slug]"
        aria-label="Close photo preview"
        title="Close"
      >
        <i class="bi bi-x-lg text-xl" aria-hidden="true"></i>
      </a>
    </header>

    <div class="relative">
      <img
        class="object-contain"
        [ngSrc]="currentPhoto().imagePath"
        [alt]="currentPhoto().name || album().name"
        fill
        priority
      >

      <a
        class="btn absolute top-1/2 left-0 btn-circle -translate-y-1/2"
        [routerLink]="['/apps/photos/album', album().slug, 'photo', previousPhotoId()]"
        aria-label="Previous photo"
        title="Previous photo"
      >
        <i class="bi bi-chevron-left text-xl" aria-hidden="true"></i>
      </a>
      <a
        class="btn absolute top-1/2 right-0 btn-circle -translate-y-1/2"
        [routerLink]="['/apps/photos/album', album().slug, 'photo', nextPhotoId()]"
        aria-label="Next photo"
        title="Next photo"
      >
        <i class="bi bi-chevron-right text-xl" aria-hidden="true"></i>
      </a>
    </div>

    <footer class="mx-auto max-w-3xl bg-neutral/75 px-4 py-2 text-center">
      <h2 id="photo-preview-title" class="text-lg font-semibold">{{currentPhoto().name || 'Photo'}}</h2>
      @if (currentPhoto().description; as description) {
        <p class="mt-1 text-sm">{{description}}</p>
      }
    </footer>
  </div>
</dialog>
